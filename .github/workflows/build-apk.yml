name: Build PocketGuitar Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Build APK and AAB
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e

          # Detect whether project is in root or in android/ subfolder
          if [ -f "android/settings.gradle.kts" ]; then
            cd android
          fi
          echo "Building in: $(pwd)"
          ls -la

          gradle --version

          echo "Running Chord & Audio DSP Verification Tests..."
          gradle testDebugUnitTest --no-daemon --stacktrace

          echo "Compiling Debug APK..."
          gradle assembleDebug --no-daemon --stacktrace

          echo "Compiling Release AAB Bundle..."
          gradle bundleRelease --no-daemon --stacktrace

          echo "Build finished! Generated outputs:"
          find . -name "*.apk" -o -name "*.aab"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketGuitar-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketGuitar-Release-AAB
          path: |
            **/app/build/outputs/bundle/release/*.aab
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
